[project]
name = "pysnmp-pysmi"
dynamic = ["version"]
description = "SNMP MIB parser"
authors = [
    {name = "Ilya Etingof", email = "etingof@gmail.com"},
    {name = "rfaircloth-splunk", email = "rfaircloth@splunk.com"},
]
license = "BSD-2-Clause"
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ply>=3.11",
    "requests>=2.31.0",
]

[project.scripts]
mibcopy = "pysmi.scripts.mibcopy:start"
mibdump = "pysmi.scripts.mibdump:start"

[project.urls]
Homepage = "https://github.com/pysnmp/pysmi"
Repository = "https://github.com/pysnmp/pysmi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pysmi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pysmi"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "BLE",    # flake8-blind-except
    "G",      # flake8-logging-format (keep logging interpolation lazy)
    "LOG",    # flake8-logging (logger misuse)
    "FLY",    # flynt (static str.join -> f-string)
    "RUF",    # ruff-specific rules
    "D1",     # pydocstyle: every public thing carries a docstring
]
ignore = [
    "E501",   # line too long (let ruff format handle it)
    "B028",   # no-explicit-stacklevel (existing pattern)
    "S603",   # subprocess-without-shell-equals-true (was B603 in bandit)
    "S607",   # start-process-with-partial-path (was B607 in bandit)
]

[tool.ruff.lint.isort]
known-first-party = ["pysmi"]

# The code generator, lexer, and reader class attributes are shared compatibility
# tables, not instance defaults. Tests execute the Python they generate.
[tool.ruff.lint.per-file-ignores]
"pysmi/codegen/base.py" = ["RUF012"]
"pysmi/codegen/jsondoc.py" = ["RUF012"]
"pysmi/codegen/pysnmp.py" = ["RUF012"]
"pysmi/codegen/symtable.py" = ["RUF012"]
"pysmi/lexer/smi.py" = ["RUF012"]
# Test names describe what they assert, so a docstring on every one of them
# would only repeat the name back.
"tests/*" = ["D1"]
"tests/harness.py" = ["S102"]
"tests/test_*.py" = ["S102"]
"tests/test_zipreader.py" = ["RUF012"]

[tool.mypy]
python_version = "3.10"
files = ["pysmi"]
ignore_missing_imports = true
warn_unreachable = true
# strict_equality caught a live bug where a tuple was compared against a string,
# so an empty DEFVAL was discarded for every type.
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pysmi --cov-report=term-missing"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pysnmplib==6.0.0rc2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "sphinx>=7.0",
    "types-requests>=2.33.0",
]
