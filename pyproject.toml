[project]
name = "pysnmp-pysmi"
dynamic = ["version"]
description = "SNMP MIB parser"
authors = [
    {name = "Ilya Etingof", email = "etingof@gmail.com"},
    {name = "rfaircloth-splunk", email = "rfaircloth@splunk.com"},
]
license = "BSD-2-Clause"
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ply>=3.11",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "sphinx>=7.0",
    "pysnmp>=4.4.12",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
mibcopy = "pysmi.scripts.mibcopy:start"
mibdump = "pysmi.scripts.mibdump:start"

[project.urls]
Homepage = "https://github.com/pysnmp/pysmi"
Repository = "https://github.com/pysnmp/pysmi"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "pysmi/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pysmi"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "S",      # flake8-bandit (security)
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (let ruff format handle it)
    "B028",   # no-explicit-stacklevel (existing pattern)
    "S603",   # subprocess-without-shell-equals-true (was B603 in bandit)
    "S607",   # start-process-with-partial-path (was B607 in bandit)
]

[tool.ruff.lint.isort]
known-first-party = ["pysmi"]

# Package initializers deliberately re-export their public APIs. The code generator,
# lexer, and reader class attributes are shared compatibility tables, not instance defaults.
[tool.ruff.lint.per-file-ignores]
"pysmi/**/__init__.py" = ["F401"]
"pysmi/codegen/base.py" = ["RUF012"]
"pysmi/codegen/jsondoc.py" = ["RUF012"]
"pysmi/codegen/pysnmp.py" = ["RUF012"]
"pysmi/codegen/symtable.py" = ["RUF012"]
"pysmi/lexer/smi.py" = ["RUF012"]
"pysmi/reader/base.py" = ["RUF012"]
"pysmi/searcher/anyfile.py" = ["RUF012"]
"tests/test_*_pysnmp.py" = ["S102"]
"tests/test_zipreader.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pysmi --cov-report=term-missing"
