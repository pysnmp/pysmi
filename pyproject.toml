[project]
name = "pysnmp-pysmi"
version = "1.2.0"
description = "SNMP MIB parser"
authors = [
    {name = "Ilya Etingof", email = "etingof@gmail.com"},
    {name = "rfaircloth-splunk", email = "rfaircloth@splunk.com"},
]
license = "BSD-2-Clause"
requires-python = ">=3.10"
readme = "README.md"
repository = "https://github.com/pysnmp/pysmi"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Telecommunications Industry",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "ply>=3.11",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "sphinx>=7.0",
    "pysnmp>=4.4.12",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "pylint>=3.0",
]

[project.scripts]
mibcopy = "pysmi.scripts.mibcopy:start"
mibdump = "pysmi.scripts.mibdump:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pysmi"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",   # line too long (let ruff format handle it)
    "B028",   # no-explicit-stacklevel (existing pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["pysmi"]

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0301",  # line-too-long
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "W0212",  # protected-access
]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.main]
py-version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pysmi --cov-report=term-missing"