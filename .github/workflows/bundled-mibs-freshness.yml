name: Bundled MIBs freshness

# Checks that pysmi/mibs/asn1/ still matches https://pysnmp.github.io/mibs/asn1/,
# so a compile that falls back to the bundled copy (see pysnmp/pysmi#113) never
# silently diverges from what the canonical source would have produced.
#
# A separate, scheduled workflow rather than a step in the main CI run: it
# depends on a third-party site being reachable, and every contributor's PR
# should not go red over an outage or a network hiccup that has nothing to do
# with their change. Run scripts/update_bundled_mibs.py by hand to refresh a
# genuine drift once this catches one.

on:
  schedule:
    - cron: "17 6 * * 1" # Monday, 06:17 UTC -- an arbitrary off-peak time
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Compare bundled MIBs against upstream
        run: uv run --locked --group dev python3 scripts/update_bundled_mibs.py --check
