name: CI

on:
  push:
    branches:
      - "main"
      - "next"
  pull_request:
    branches: [main, next]
    # `labeled` so that adding ci:full-matrix re-runs with macOS as well.
    types: [opened, synchronize, reopened, labeled]
  # No push releases anything. Both the rc from next and the GA from main are
  # cut by dispatching this workflow by hand.
  workflow_dispatch:

# One run per ref: a new push supersedes the one still in flight. cancel-in-
# progress is read off the *incoming* run, so a dispatch cannot protect itself
# from one -- and semantic-release pushes the release commit to the very branch
# it is releasing, which queued a push run that cancelled the dispatch between
# the git plugin (commit + tag) and the github plugin (the GitHub release).
# Giving the dispatch a lane of its own is what actually keeps it uncancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'release' || 'ci' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# Read-only by default; the publish job raises only what Trusted Publishing
# needs, while semantic-release authenticates with SEMREL_TOKEN.
permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pre-commit/action is archived at v3.0.1 and pins actions/cache@v4
      # inside itself, which runs on the deprecated Node 20 runtime. Its steps
      # are short enough to keep here instead, on a cache action that is not.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install pre-commit
          pre-commit run --show-diff-on-failure --color=always --all-files

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install UV
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      # The pre-commit job runs ruff and mypy too, but mypy there sees none of
      # this package's dependencies -- so anything that turns on a pyasn1 type
      # only fails here. Matches pyasn1's and pysnmp's lint job.
      - name: Run Ruff
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run mypy
        run: uv run mypy

  # Every supported Python on Linux, plus the edge versions on Windows, on
  # every run -- pull requests included. Windows is where this package's
  # assumptions actually differ: line endings on checkout, path separators,
  # no `pwd`. Leaving it to a label meant breakage reached next and was found
  # there rather than on the pull request that caused it. macOS is the one
  # kept behind the label: it has yet to catch anything Linux did not, so it
  # runs on a push to main/next, a manual dispatch, or a PR labelled
  # ci:full-matrix.
  setup-matrix:
    name: matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          BROAD: >-
            ${{ github.event_name != 'pull_request'
              || contains(github.event.pull_request.labels.*.name, 'ci:full-matrix') }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          pythons = ["3.10", "3.11", "3.12", "3.13", "3.14"]
          edges = (pythons[0], pythons[-1])

          jobs = [{"os": "ubuntu-latest", "python": p} for p in pythons]
          jobs += [{"os": "windows-latest", "python": p} for p in edges]

          if os.environ["BROAD"] == "true":
              jobs += [{"os": "macos-latest", "python": p} for p in edges]

          print("include=" + json.dumps(jobs))
          PY

  run-unit-tests:
    name: test-unit (py${{ matrix.python }} ${{ matrix.os }})
    strategy:
      matrix:
        include: ${{ fromJSON(needs.setup-matrix.outputs.include) }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    needs:
      - build
      - setup-matrix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # The consumer smoke test loads generated modules under pysnmp, which
      # ships on its own cycle. Its regression is not ours, so it runs in the
      # non-gating job below rather than here. See pysnmp/pysmi#127.
      - name: Run tests
        run: >
          uv run --locked --group dev --python ${{ matrix.python }}
          pytest -m "not pysnmp_consumer"
          --junitxml=test-results/results.xml --cov=pysmi --cov-report=xml tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  run-consumer-smoke:
    name: test-consumer (pysnmp, non-gating)
    # Reports its result without blocking a merge: a red here means pysnmp
    # changed under us, which is worth seeing and is not a pysmi defect.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Load generated modules under pysnmp
        run: >
          uv run --locked --group dev --python 3.13
          pytest -m pysnmp_consumer --no-header -q tests

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # -n reports cross-references that resolve to nothing, so a docstring or
      # page still pointing at a renamed API fails here rather than on Read the
      # Docs after merge. -W makes those warnings an error, --keep-going lists
      # all of them instead of stopping at the first.
      - name: Build documentation
        run: uv run --locked --group dev sphinx-build -n -W --keep-going -b html docs/source docs/build
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/build

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # One check name for the branch ruleset to require, standing in for every
  # gating job below. The test matrix cannot be named directly: its job names
  # carry the Python version and the runner, the set of them changes with the
  # labels on a pull request, and a required check that stops reporting is
  # indistinguishable -- to a pull request -- from one that is failing. See
  # .github/rulesets/README.md.
  ci-gate:
    name: ci-gate
    # always(), or a failure anywhere upstream skips this job too, and a
    # skipped required check never reports: the pull request would just hang.
    if: always()
    needs:
      - pre-commit
      - lint
      - docs
      - build
      - setup-matrix
      - run-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every gating job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys

          results = {name: job["result"] for name, job in json.loads(os.environ["NEEDS"]).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
              # Skipped counts as a failure: a job that never ran has not
              # passed, and a job whose dependency failed is skipped, not red.
              if result != "success":
                  print(f"::error::{name} did not succeed ({result})")
          sys.exit(0 if all(r == "success" for r in results.values()) else 1)
          PY

  publish:
    name: Build Release
    # Semantic-release cuts tags from a branch, so keep this to branch refs and
    # it can never re-enter on a tag it created itself. The push triggers are
    # filtered to main and next, but a dispatch can name any branch, so name
    # them again here: next cuts the rc, main cuts the GA, nothing else runs.
    if: >-
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    needs:
      - pre-commit
      - lint
      - build
      - docs
      - run-unit-tests
    runs-on: ubuntu-latest
    # Nothing here reaches PyPI: this job cuts the version, the tag and the
    # GitHub release and stops. publish-to-pypi.yml uploads off that tag, so a
    # failed upload is re-runnable without re-running the release.
    env:
      # Releasing is a deliberate act on both branches. Every push — to next as
      # much as to main — rehearses the release and stops; only a dispatch cuts
      # one. Automatic rcs are what let next drift below a GA already on PyPI.
      DRY: ${{ github.event_name != 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          # semantic-release 25 needs ^22.14, and @semantic-release/changelog
          # and /git need ^22.22.2 || >=24.15. Pin the major here rather than
          # inherit whatever node the runner image happens to ship.
          node-version: "24"
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 25
          dry_run: ${{ env.DRY }}
          # Pinned to majors: the action npm-installs these fresh on every
          # run, so an unpinned name is whatever was published that morning.
          # The preset stays on 9 deliberately -- 10 renders through
          # conventional-changelog-writer@9, and semantic-release 25 still
          # carries writer 8, which fails at note-generation time.
          extra_plugins: |
            @semantic-release/changelog@7
            @semantic-release/exec@7
            @semantic-release/git@11
            @google/semantic-release-replace-plugin@1
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }}
      # A dry run tags nothing and builds nothing, so the version the branch
      # would release is only ever a log line. Build it as a .devN and keep it,
      # so the release can be installed and tried before it is cut.
      - name: Build the release this branch would cut
        if: env.DRY == 'true' && steps.semantic.outputs.new_release_version != ''
        run: |
          sed -i 's/^__version__ = .*/__version__ = "${{ steps.semantic.outputs.new_release_version }}.dev${{ github.run_number }}"/' pysmi/__init__.py
          uv build
      - uses: actions/upload-artifact@v7
        if: env.DRY == 'true' && steps.semantic.outputs.new_release_version != ''
        with:
          name: dist-preview-${{ steps.semantic.outputs.new_release_version }}.dev${{ github.run_number }}
          path: dist
