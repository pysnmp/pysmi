name: CI

on:
  push:
    branches:
      - "main"
      - "next"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main, next]
  # next publishes an rc on every push. main only previews what it would
  # release: cutting the GA is a deliberate act, so it is a dispatch.
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  run-unit-tests:
    name: test-unit (py${{ matrix.python }} ${{ matrix.os }})
    strategy:
      matrix:
        # Every supported Python on Linux; macOS and Windows track the newest
        # one only, to catch platform breakage without a full cross product.
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run tests
        run: >
          uv run --locked --group dev --python ${{ matrix.python }}
          pytest --junitxml=test-results/results.xml --cov=pysmi --cov-report=xml tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # -n reports cross-references that resolve to nothing, so a docstring or
      # page still pointing at a renamed API fails here rather than on Read the
      # Docs after merge. -W makes those warnings an error, --keep-going lists
      # all of them instead of stopping at the first.
      - name: Build documentation
        run: uv run --locked --group dev sphinx-build -n -W --keep-going -b html docs/source docs/build
      - uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/build

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  publish:
    name: Build Release
    needs:
      - pre-commit
      - build
      - docs
      - run-unit-tests
    runs-on: ubuntu-latest
    # PyPI knows this workflow, in this repository, in this environment. Nothing
    # here holds a credential: the OIDC token is minted per run and expires.
    environment: release
    permissions:
      id-token: write
      contents: write
      issues: write
    env:
      # Only two things cut a real release: a push to next, and a dispatch.
      # Everything else — pushes to main and every pull request — rehearses one
      # and stops.
      DRY: ${{ !(github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == 'next')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # Very important: semantic-release won't trigger a tagged
          # build if this is not set false
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          dry_run: ${{ env.DRY }}
          extra_plugins: |
            @semantic-release/exec
            @semantic-release/git
            @google/semantic-release-replace-plugin@1.2.7
            conventional-changelog-conventionalcommits@8.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.SEMREL_TOKEN }}
      - name: Publish to PyPI
        if: env.DRY != 'true' && steps.semantic.outputs.new_release_published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
      # A dry run tags nothing and builds nothing, so the version the branch
      # would release is only ever a log line. Build it as a .devN and keep it,
      # so the release can be installed and tried before it is cut.
      - name: Build the release this branch would cut
        if: env.DRY == 'true' && steps.semantic.outputs.new_release_version != ''
        run: |
          sed -i 's/^__version__ = .*/__version__ = "${{ steps.semantic.outputs.new_release_version }}.dev${{ github.run_number }}"/' pysmi/__init__.py
          uv build
      - uses: actions/upload-artifact@v4
        if: env.DRY == 'true' && steps.semantic.outputs.new_release_version != ''
        with:
          name: dist-preview
          path: dist

  update-semver:
    name: Move Respository semver tags
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haya14busa/action-update-semver@v1
